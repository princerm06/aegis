[project]
name = "ppo-experiment"
version = "0.1.0"
description = "Isolated synthetic PPO allocation experiment (advisory only, no dispatch)"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.4,<3",
    "torch>=2.2",
    "numpy>=1.26,<3",
    "ortools>=9.14,<10",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
