# Public clips and what each should show, scored by `python -m cv.tools.validate`.
# Paths are relative to cv/recordings/ (git-ignored; see "Public datasets" in
# cv/README.md for where each clip comes from). Missing clips are skipped.
# Check kinds and scores: cv/tools/validate.py. end_s: null = to the end.

clips:
  - name: car-crash-head-blood
    source: datasets/stock/mixkit-blood-car-crash.mp4
    checks:
      - {kind: region, sign: visible_blood, value: head}
      - {kind: absent, sign: fall, value: seen}
      - {kind: absent, sign: waving, value: seen}

  - name: roses-no-blood                     # red roses next to a woman lying on the floor
    source: datasets/stock/pexels-woman-lying-floor.mp4
    checks:
      - {kind: no_blood, sign: visible_blood}
      - {kind: absent, sign: fall, value: seen}
      - {kind: absent, sign: waving, value: seen}

  - name: three-lying-no-blood
    source: datasets/stock/pexels-three-lying-overhead.mp4
    checks:
      - {kind: absent, sign: person_nearby, value: seen}   # nobody upright next to them
      - {kind: no_blood, sign: visible_blood}
      - {kind: absent, sign: fall, value: seen}
      - {kind: absent, sign: waving, value: seen}

  - name: eyes-closed-man
    source: datasets/stock/pexels-man-eyes-closed-breathing.mp4
    checks:
      - {kind: value, sign: eyes, value: closed}
      - {kind: absent, sign: fall, value: seen}
      - {kind: absent, sign: waving, value: seen}

  - name: sleeping-man-eyes                  # handheld, slow pan
    source: datasets/stock/pexels-man-sleeping-720.mp4
    moving_camera: true
    checks:
      - {kind: value, sign: eyes, value: closed}
      - {kind: absent, sign: fall, value: seen}
      - {kind: absent, sign: waving, value: seen}

  - name: sleeping-woman-eyes
    source: datasets/stock/pexels-woman-sleeping-720.mp4
    checks:
      - {kind: value, sign: eyes, value: closed}
      - {kind: absent, sign: fall, value: seen}
      - {kind: absent, sign: waving, value: seen}

  - {name: urfall-01-lying, source: datasets/urfall/fall-01-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-02-lying, source: datasets/urfall/fall-02-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-03-lying, source: datasets/urfall/fall-03-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-04-lying, source: datasets/urfall/fall-04-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-05-lying, source: datasets/urfall/fall-05-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-06-lying, source: datasets/urfall/fall-06-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-07-lying, source: datasets/urfall/fall-07-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-08-lying, source: datasets/urfall/fall-08-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-09-lying, source: datasets/urfall/fall-09-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}
  - {name: urfall-10-lying, source: datasets/urfall/fall-10-cam0.mp4, checks: [{kind: reaches, sign: posture, value: lying}, {kind: reaches, sign: fall, value: seen}]}

  # --- Breathing on real people (no reference rates are published, so these
  # test failure directions, not rate accuracy). Clips stay local, numbers only.
  # MPSC-RR (CC BY 4.0, Hasan et al., CHASE 2025): close torso crops, 1-1.5 m.
  # MPSC-RespView (CC BY-NC 4.0, Sakib & Roy, WACV 2027; non-commercial use,
  # no attempts to identify anyone). Breathing throughout the lying clips; the
  # outdoor clips are about 20 s normal, 20 s held, 20 s forced (approximate).

  - {name: mpsc-rr-s1-lying, source: datasets/mpsc-rr/s1_lying.mov, checks: [{kind: value, sign: breathing, value: motion_detected, start_s: 20}, {kind: absent, sign: breathing, value: no_motion_detected, start_s: 20}]}
  - {name: mpsc-rr-s2-lying, source: datasets/mpsc-rr/s2_lying.mov, checks: [{kind: value, sign: breathing, value: motion_detected, start_s: 20}, {kind: absent, sign: breathing, value: no_motion_detected, start_s: 20}]}
