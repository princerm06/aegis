# Live demo: the C922 mounted high (2-2.5 m, angled about 45 degrees down, not
# straight down) over two actors lying in one room. Same rooms as rooms.yaml;
# everyone seen is reported in the room picked with --room or keys 1-3.
#
#   python -m cv.main --config cv/config/demo.yaml --room room-2 --send-signs --stream-port 8090
#
# Dashboard camera tile: http://127.0.0.1:8090/stream.mjpg
# Dashboard "command given" button (same as key c): POST http://127.0.0.1:8090/command
# Unlisted settings use the defaults in cv/settings.py (same as pipeline.yaml).

camera:
  name: C922
  index: 0
  width: 1920               # faces stay big enough for the eye check at 2-3 m
  height: 1080
  fps: 30

mapping:
  mode: zones
  zone_select: keys
  frame_id: demo-floor-1
  zones:
    - id: room-1
      x_m: 3.0
      y_m: 2.0
    - id: room-2
      x_m: 14.0
      y_m: 8.0
    - id: room-3
      x_m: 18.0
      y_m: 14.0

tracking:
  # The backend links each casualty to one track for good, so an actor must keep
  # their track ID when someone stands in front of them or the detector drops
  # them for a while: keep unseen tracks for 5 minutes (re-attached when seen
  # again near where they were) instead of 30 s. The cost: someone who walked
  # through stays listed as occluded for 5 minutes too.
  lost_after_s: 300.0
  # Demo only. Every visible/occluded change replans the route, and a helper
  # kneeling beside an actor drops the detection for about 0.6 s. With 0.5 s
  # (the default) each kneel flipped the track to occluded and back; with 1.5 s
  # the helper-kneels take had no flips (replans 6 -> 4 in 85 s). The cost: a
  # real occlusion is reported 1.5 s after the actor was last seen instead of
  # 0.5 s. It does not stop replans from the confidence crossing the backend's
  # 0.5 threshold (the other 4), and it does not help when someone walking past
  # makes the actor get a new track ID.
  occlusion_grace_s: 1.5

signs:
  enabled: true
  # Sound activity at the C922's own microphone (the responder calling out "Can
  # you hear me?", or any loud sound) starts the response check; loudness only,
  # not speech recognition (cv/voice_cue.py). The key c stays as backup.
  voice_cue_mic: C922
  # Seen from above, open eyelids look half closed: in the high-camera demo-two
  # take open eyes scored about 0.45 and closed eyes about 0.75 (0.4 is tuned on
  # frontal faces, where closed eyes score 0.7-0.9).
  eyes_closed_threshold: 0.6
  # Lying 3 m away the eyes are 8-17 px apart and score 0.35-0.7 open or closed,
  # so read faces only from about 22 px between the eyes (half lying at 2-3 m: 25-35 px).
  eyes_min_face_px: 72

publisher:
  camera_id: room-cam-1
  # The venue hotspot answers in 2-5 s (30 KB/s); 1.5 s gave up on every request.
  # Sends run off the camera loop and keep only the newest report per person.
  timeout_s: 8.0
