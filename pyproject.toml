[project]
name = "aegis"
version = "0.1.0"
description = "Human-supervised emergency coordination development scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "ortools>=9.14,<10",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]
ems = [
    "pandas==3.1.1",
    "scikit-learn==1.7.2",
    "truststore==0.10.5",
    "xgboost==3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "optimization/tests", "hardware/tests", "experiments/neural_assignment/tests"]
pythonpath = [".", "experiments/neural_assignment/src"]
addopts = "-ra"
